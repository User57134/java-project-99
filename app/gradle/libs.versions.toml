[versions]
spring-boot-plugin = "4.1.2"
lombok-plugin = "9.5.0"
spotless-plugin = "8.10.1"
h2database-lib = "2.5.252"
postgresql-lib = "42.7.14"
jackson-databind-nullable-lib = "0.2.11"
mapstruct-lib = "1.6.3"
sentry-starter-lib = "8.63.0"

[plugins]
spring-boot = {id = "org.springframework.boot", version.ref = "spring-boot-plugin"}
lombok = {id = "io.freefair.lombok", version.ref = "lombok-plugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless-plugin" }

[libraries]
# Объявляем список совместимости версий для spring boot как библиотеку
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot-plugin" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
sentry-spring-boot-starter = { module = "io.sentry:sentry-spring-boot-4", version.ref = "sentry-starter-lib" }
h2database = { module = "com.h2database:h2", version.ref = "h2database-lib" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql-lib" }
jackson-databind-nullable = { module = "org.openapitools:jackson-databind-nullable", version.ref = "jackson-databind-nullable-lib" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct-lib" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct-lib" }
